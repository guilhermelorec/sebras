services:
  oracle:
    build:
      context: .
      dockerfile: docker/oracle/Dockerfile
    container_name: sebras-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: votacao
      APP_USER_PASSWORD: votacao
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  wildfly:
    build:
      context: .
      dockerfile: docker/wildfly/Dockerfile
    container_name: sebras-wildfly
    ports:
      - "8080:8080"
    environment:
      VOTACAO_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      VOTACAO_DB_USER: votacao
      VOTACAO_DB_PASSWORD: votacao
      JAVA_OPTS_APPEND: -Dvotacao.connection.mode=ucp
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  oracle-data:
